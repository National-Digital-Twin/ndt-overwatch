version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories: 
      - "/"
      - "/scripts/supplier-register"
    target-branch: "develop"
    schedule:
      interval: "weekly"
